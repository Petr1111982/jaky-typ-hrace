<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaký typ hráče jsi?</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #1e293b;
      border-radius: 24px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .question {
      font-size: 24px;
      margin-bottom: 25px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #334155;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #475569;
    }

    .start {
      background: #6366f1;
      font-size: 18px;
      font-weight: bold;
      padding: 18px;
    }

    .start:hover {
      background: #818cf8;
    }

    .result {
      display: none;
    }

    .result h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .result p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .emoji {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .restart {
      background: #6366f1;
    }

    .progress {
      color: #94a3b8;
      margin-bottom: 15px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .container {
        padding: 30px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="startScreen">
      <div class="emoji">🎮</div>

      <h1>Jaký typ hráče jsi?</h1>

      <p class="subtitle">
        Odpověz na pár otázek a zjisti, jaký hráč se v tobě skrývá.
      </p>

      <button class="start" onclick="startQuiz()">
        Začít test
      </button>
    </div>


    <div id="quizScreen" style="display:none;">

      <div class="progress" id="progress"></div>

      <div class="question" id="question"></div>

      <div class="answers" id="answers"></div>

    </div>


    <div class="result" id="result">

      <div class="emoji" id="resultEmoji"></div>

      <h2 id="resultTitle"></h2>

      <p id="resultText"></p>

      <button class="restart" onclick="restartQuiz()">
        Zkusit znovu
      </button>

    </div>

  </div>


<script>

const questions = [

  {
    question: "Co uděláš, když tvůj tým prohrává?",
    answers: [
      ["Snažím se tým zachránit", "leader"],
      ["Vymyslím novou strategii", "strategist"],
      ["Je mi to jedno, hlavně zábava", "troll"],
      ["Začnu hrát ještě víc agresivně", "tryhard"]
    ]
  },

  {
    question: "Co tě na hrách baví nejvíc?",
    answers: [
      ["Vyhrávat", "tryhard"],
      ["Plánování a taktika", "strategist"],
      ["Hrát s kamarády", "team"],
      ["Dělat blbosti a srandu", "troll"]
    ]
  },

  {
    question: "Jak reaguješ na prohru?",
    answers: [
      ["GG, příště vyhraju", "tryhard"],
      ["Přemýšlím, kde byla chyba", "strategist"],
      ["Směju se tomu", "troll"],
      ["Povzbudím tým", "team"]
    ]
  },

  {
    question: "Jakou roli by sis vybral v týmu?",
    answers: [
      ["Velitel", "leader"],
      ["Strateg", "strategist"],
      ["Útočník", "tryhard"],
      ["Support", "team"]
    ]
  },

  {
    question: "Jak vypadá tvoje ideální herní session?",
    answers: [
      ["Chci vyhrát všechno", "tryhard"],
      ["Dlouhá strategická hra", "strategist"],
      ["Hraju s partou kamarádů", "team"],
      ["Totální chaos", "troll"]
    ]
  },

  {
    question: "Když objevíš nový trik ve hře...",
    answers: [
      ["Hned ho začnu používat", "tryhard"],
      ["Zkoumám, jak funguje", "strategist"],
      ["Ukážu ho kamarádům", "team"],
      ["Použiju ho úplně nesmyslně", "troll"]
    ]
  }

];


const results = {

  tryhard: {
    emoji: "🔥",
    title: "TRYHARD",
    text: "Ty nejsi ve hře proto, abys prohrával. Každá hra je pro tebe výzva a když jde do tuhého, zapínáš svůj ultimátní režim."
  },

  strategist: {
    emoji: "🧠",
    title: "STRATÉG",
    text: "Než něco uděláš, přemýšlíš. Dokážeš plánovat několik kroků dopředu a vítězství si raději připravíš než náhodně vybojuješ."
  },

  troll: {
    emoji: "😂",
    title: "TROLL",
    text: "Hlavní je zábava. Výhra je fajn, ale když se u toho všichni smějí, je to ještě lepší. Chaos je tvoje druhé jméno."
  },

  team: {
    emoji: "🤝",
    title: "TEAM PLAYER",
    text: "Bez týmu nejsi úplně ve své kůži. Pomáháš ostatním, komunikuješ a víš, že nejlepší vítězství je to, které získáte společně."
  },

  leader: {
    emoji: "👑",
    title: "LEADER",
    text: "Když nikdo neví, co dělat, přirozeně převezmeš vedení. Umíš rozhodovat a ostatní se na tebe mohou spolehnout."
  }

};


let currentQuestion = 0;
let scores = {
  tryhard: 0,
  strategist: 0,
  troll: 0,
  team: 0,
  leader: 0
};


function startQuiz() {

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";

  showQuestion();

}


function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("progress").textContent =
    `Otázka ${currentQuestion + 1} z ${questions.length}`;

  document.getElementById("question").textContent =
    q.question;

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  q.answers.forEach(answer => {

    const button = document.createElement("button");

    button.textContent = answer[0];

    button.onclick = () => chooseAnswer(answer[1]);

    answers.appendChild(button);

  });

}


function chooseAnswer(type) {

  scores[type]++;

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    showResult();

  } else {

    showQuestion();

  }

}


function showResult() {

  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("result").style.display = "block";

  let winner = Object.keys(scores).reduce((a, b) =>
    scores[a] > scores[b] ? a : b
  );

  const result = results[winner];

  document.getElementById("resultEmoji").textContent = result.emoji;
  document.getElementById("resultTitle").textContent = result.title;
  document.getElementById("resultText").textContent = result.text;

}


function restartQuiz() {

  currentQuestion = 0;

  scores = {
    tryhard: 0,
    strategist: 0,
    troll: 0,
    team: 0,
    leader: 0
  };

  document.getElementById("result").style.display = "none";
  document.getElementById("startScreen").style.display = "block";

}

</script>

</body>
</html>
